<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹数字猎手 | 视觉盛宴猜数字游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局重置与基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        /* 背景动画粒子 */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 霓虹灯光晕效果 */
        .glow {
            text-shadow: 
                0 0 10px #00f7ff,
                0 0 20px #00f7ff,
                0 0 40px #00f7ff,
                0 0 80px #00f7ff;
        }

        /* 主容器 */
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: containerAppear 1.5s ease-out forwards;
            animation-delay: 0.5s;
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00f7ff, #ff00ff, #00ff9d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
            animation: titleGlow 4s infinite alternate;
        }

        @keyframes titleGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(0, 247, 255, 0.7));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.7));
            }
        }

        .subtitle {
            font-size: 1.3rem;
            color: #a0a0ff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* 游戏信息面板 */
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            flex: 1;
            min-width: 250px;
            border: 1px solid rgba(0, 247, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .info-card:hover {
            transform: translateY(-10px);
            border-color: #00f7ff;
            box-shadow: 0 15px 40px rgba(0, 247, 255, 0.3);
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.7s;
        }

        .info-card:hover::before {
            left: 100%;
        }

        .info-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #00f7ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        /* 输入区域 */
        .input-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .input-section::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 247, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-label {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: block;
            color: #fff;
        }

        .input-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .number-input {
            width: 200px;
            height: 200px;
            font-size: 5rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #00f7ff;
            border-radius: 50%;
            color: #fff;
            outline: none;
            transition: all 0.4s;
            box-shadow: 
                0 0 20px rgba(0, 247, 255, 0.5),
                inset 0 0 20px rgba(0, 247, 255, 0.2);
        }

        .number-input:focus {
            border-color: #ff00ff;
            box-shadow: 
                0 0 40px rgba(255, 0, 255, 0.7),
                inset 0 0 30px rgba(255, 0, 255, 0.3);
            transform: scale(1.05);
        }

        .input-range {
            position: absolute;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            bottom: -20px;
            left: 0;
            border-radius: 5px;
        }

        /* 按钮区域 */
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 40px;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f7ff, #0066ff);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 247, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 247, 255, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff00ff, #cc00ff);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 0, 255, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 0, 255, 0.6);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ff9d00, #ff5500);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 157, 0, 0.4);
        }

        .btn-warning:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 157, 0, 0.6);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        .btn:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(40, 40);
                opacity: 0;
            }
        }

        /* 结果区域 */
        .result-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .result-text {
            font-size: 2.2rem;
            font-weight: 700;
            padding: 20px;
            transition: all 0.5s;
            z-index: 2;
            position: relative;
        }

        .result-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 247, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* 历史记录 */
        .history-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .history-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00f7ff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00f7ff, #ff00ff);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border-left: 5px solid #00f7ff;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(10px);
        }

        .history-guess {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .history-status {
            font-size: 1.5rem;
            padding: 8px 20px;
            border-radius: 50px;
        }

        .status-low {
            background: rgba(0, 123, 255, 0.2);
            color: #00a8ff;
            border: 1px solid #00a8ff;
        }

        .status-high {
            background: rgba(255, 0, 128, 0.2);
            color: #ff00aa;
            border: 1px solid #ff00aa;
        }

        .status-correct {
            background: rgba(0, 255, 42, 0.2);
            color: #00ff2a;
            border: 1px solid #00ff2a;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 42, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 42, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 42, 0); }
        }

        /* 粒子动画 */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background-color: #f00;
            top: 0;
            opacity: 0;
            z-index: 1000;
        }

        /* 胜利动画 */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
            }
            
            .number-input {
                width: 150px;
                height: 150px;
                font-size: 3.5rem;
            }
            
            .game-info {
                flex-direction: column;
            }
            
            .info-card {
                min-width: 100%;
            }
            
            .btn {
                min-width: 140px;
                padding: 15px 25px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2.5rem;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .input-section {
                padding: 25px;
            }
            
            .buttons {
                gap: 15px;
            }
            
            .btn {
                min-width: 120px;
                padding: 12px 20px;
                font-size: 1.1rem;
            }
        }

        /* 自定义光标 */
        body {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%2300f7ff" opacity="0.7"/></svg>') 12 12, auto;
        }

        .btn, .number-input, .history-item {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%23ff00ff" opacity="0.7"/></svg>') 12 12, pointer;
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    
    <!-- 庆祝效果容器 -->
    <div class="celebration" id="celebration"></div>
    
    <div class="game-container">
        <!-- 标题区域 -->
        <div class="header">
            <div class="subtitle">沉浸式数字冒险</div>
            <h1 class="title glow">霓虹数字猎手</h1>
            <div class="subtitle">找到隐藏的数字，赢取虚拟荣耀</div>
        </div>
        
        <!-- 游戏信息 -->
        <div class="game-info">
            <div class="info-card">
                <h3><i class="fas fa-crosshairs"></i> 目标范围</h3>
                <p id="range">1 - 100</p>
            </div>
            <div class="info-card">
                <h3><i class="fas fa-bullseye"></i> 尝试次数</h3>
                <p id="attemptCount">0</p>
            </div>
            <div class="info-card">
                <h3><i class="fas fa-clock"></i> 游戏时间</h3>
                <p id="timer">00:00</p>
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-section">
            <span class="input-label">输入你的猜测数字</span>
            <div class="input-wrapper">
                <input type="number" id="guessInput" class="number-input" min="1" max="100" placeholder="?" onkeypress="handleKeyPress(event)">
                <div class="input-range"></div>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" onclick="checkGuess()">
                    <i class="fas fa-rocket"></i> 发射猜测
                </button>
                <button class="btn btn-secondary" onclick="showHint()">
                    <i class="fas fa-lightbulb"></i> 获取提示
                </button>
                <button class="btn btn-warning" onclick="resetGame()">
                    <i class="fas fa-redo"></i> 重置游戏
                </button>
            </div>
        </div>
        
        <!-- 结果区域 -->
        <div class="result-container">
            <div class="result-bg" id="resultBg"></div>
            <div class="result-text" id="result">等待你的第一次猜测...</div>
        </div>
        
        <!-- 历史记录 -->
        <div class="history-container">
            <h3 class="history-title">
                <i class="fas fa-history"></i> 猜测历史
            </h3>
            <div class="history-list" id="historyList">
                <!-- 历史记录将动态添加 -->
            </div>
        </div>
    </div>

    <!-- 粒子库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // 游戏变量
        let secretNumber;
        let attempts = 0;
        let gameOver = false;
        let guessHistory = [];
        let startTime;
        let timerInterval;
        let particlesInitialized = false;

        // 初始化游戏
        function initGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            gameOver = false;
            guessHistory = [];
            startTime = new Date();
            
            // 更新显示
            updateDisplay();
            
            // 设置结果区域
            document.getElementById('result').innerHTML = '等待你的第一次猜测...';
            document.getElementById('result').style.color = '#fff';
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();
            
            // 启动计时器
            clearInterval(timerInterval);
            startTimer();
            
            // 初始化粒子背景（如果未初始化）
            if (!particlesInitialized) {
                initParticles();
                particlesInitialized = true;
            }
            
            // 调试用（实际游戏中可移除）
            console.log('神秘数字（仅开发者可见）:', secretNumber);
        }

        // 初始化粒子背景
        function initParticles() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 150, density: { enable: true, value_area: 800 } },
                    color: { value: ["#00f7ff", "#ff00ff", "#00ff9d", "#ff9d00"] },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#ffffff",
                        opacity: 0.2,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                },
                retina_detect: true
            });
        }

        // 启动计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                const now = new Date();
                const diff = Math.floor((now - startTime) / 1000);
                const minutes = Math.floor(diff / 60).toString().padStart(2, '0');
                const seconds = (diff % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        // 检查猜测
        function checkGuess() {
            if (gameOver) return;
            
            const input = document.getElementById('guessInput');
            const guess = parseInt(input.value);
            const resultDiv = document.getElementById('result');
            const resultBg = document.getElementById('resultBg');
            
            // 验证输入
            if (isNaN(guess) || guess < 1 || guess > 100) {
                // 输入错误动画
                resultDiv.innerHTML = '❌ 请输入1-100之间的有效数字！';
                resultDiv.style.color = '#ff5555';
                resultBg.style.background = 'radial-gradient(circle at center, rgba(255, 0, 0, 0.3) 0%, transparent 70%)';
                resultBg.style.opacity = '1';
                
                // 震动输入框
                input.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    input.style.animation = '';
                    resultBg.style.opacity = '0';
                }, 500);
                
                input.focus();
                return;
            }
            
            attempts++;
            guessHistory.push(guess);
            
            // 更新尝试次数
            document.getElementById('attemptCount').textContent = attempts;
            
            // 检查猜测结果
            if (guess === secretNumber) {
                // 猜对了！
                resultDiv.innerHTML = `🎉 太棒了！你找到了神秘数字 <span class="glow">${secretNumber}</span>！`;
                resultDiv.style.color = '#00ff9d';
                resultBg.style.background = 'radial-gradient(circle at center, rgba(0, 255, 157, 0.4) 0%, transparent 70%)';
                resultBg.style.opacity = '1';
                
                gameOver = true;
                clearInterval(timerInterval);
                
                // 庆祝效果
                celebrate();
                createConfetti();
                
                // 保存高分记录
                saveHighScore();
            } else if (guess < secretNumber) {
                // 猜小了
                resultDiv.innerHTML = `📈 数字 <span class="glow">${guess}</span> 太小了，试试更大的！`;
                resultDiv.style.color = '#00a8ff';
                resultBg.style.background = 'radial-gradient(circle at center, rgba(0, 168, 255, 0.3) 0%, transparent 70%)';
                resultBg.style.opacity = '1';
            } else {
                // 猜大了
                resultDiv.innerHTML = `📉 数字 <span class="glow">${guess}</span> 太大了，试试更小的！`;
                resultDiv.style.color = '#ff00aa';
                resultBg.style.background = 'radial-gradient(circle at center, rgba(255, 0, 170, 0.3) 0%, transparent 70%)';
                resultBg.style.opacity = '1';
            }
            
            // 5秒后淡出背景
            setTimeout(() => {
                resultBg.style.opacity = '0';
            }, 3000);
            
            updateDisplay();
            input.value = '';
            input.focus();
            
            // 添加额外提示
            if (attempts >= 8 && !gameOver) {
                resultDiv.innerHTML += `<br><i class="fas fa-info-circle"></i> 提示：目标数字是 ${getParity()} 数`;
            }
            
            if (attempts >= 12 && !gameOver) {
                resultDiv.innerHTML += `<br><i class="fas fa-fire"></i> 加油，你离目标越来越近了！`;
            }
        }

        // 获取数字奇偶性提示
        function getParity() {
            return secretNumber % 2 === 0 ? '偶' : '奇';
        }

        // 更新显示
        function updateDisplay() {
            // 更新历史记录
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            guessHistory.forEach((guess, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.style.animationDelay = `${index * 0.1}s`;
                
                const guessDiv = document.createElement('div');
                guessDiv.className = 'history-guess';
                guessDiv.textContent = guess;
                
                const statusDiv = document.createElement('div');
                statusDiv.className = 'history-status';
                
                if (guess === secretNumber && gameOver) {
                    statusDiv.textContent = '命中目标！';
                    statusDiv.classList.add('status-correct');
                } else if (guess < secretNumber) {
                    statusDiv.textContent = '偏低';
                    statusDiv.classList.add('status-low');
                } else {
                    statusDiv.textContent = '偏高';
                    statusDiv.classList.add('status-high');
                }
                
                historyItem.appendChild(guessDiv);
                historyItem.appendChild(statusDiv);
                historyList.appendChild(historyItem);
            });
            
            // 滚动到底部
            historyList.scrollTop = historyList.scrollHeight;
        }

        // 显示提示
        function showHint() {
            if (gameOver || attempts === 0) return;
            
            const lastGuess = guessHistory[guessHistory.length - 1];
            const diff = Math.abs(secretNumber - lastGuess);
            let hint = '';
            let color = '';
            
            if (diff <= 5) {
                hint = '🔥 烧起来了！非常接近！';
                color = '#ff5500';
            } else if (diff <= 10) {
                hint = '👌 接近目标了，继续努力！';
                color = '#ffaa00';
            } else if (diff <= 20) {
                hint = '👉 在正确的轨道上，但还有距离';
                color = '#00a8ff';
            } else {
                hint = '🧭 离目标还有一段距离，继续探索！';
                color = '#a0a0ff';
            }
            
            const resultDiv = document.getElementById('result');
            const resultBg = document.getElementById('resultBg');
            
            resultDiv.innerHTML = `💡 ${hint} (与上次猜测相差 ${diff})`;
            resultDiv.style.color = color;
            resultBg.style.background = `radial-gradient(circle at center, ${color}40 0%, transparent 70%)`;
            resultBg.style.opacity = '1';
            
            // 3秒后淡出
            setTimeout(() => {
                resultBg.style.opacity = '0';
            }, 3000);
        }

        // 重置游戏
        function resetGame() {
            // 添加重置动画
            document.querySelector('.game-container').style.animation = 'none';
            setTimeout(() => {
                document.querySelector('.game-container').style.animation = 'containerAppear 1s ease-out forwards';
            }, 10);
            
            initGame();
        }

        // 庆祝效果
        function celebrate() {
            const celebration = document.getElementById('celebration');
            celebration.style.opacity = '1';
            
            // 创建多个庆祝元素
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createCelebrationElement();
                }, i * 50);
            }
            
            // 3秒后淡出
            setTimeout(() => {
                celebration.style.opacity = '0';
                celebration.innerHTML = '';
            }, 3000);
        }

        // 创建庆祝元素
        function createCelebrationElement() {
            const celebration = document.getElementById('celebration');
            const el = document.createElement('div');
            el.style.position = 'absolute';
            el.style.width = Math.random() * 30 + 10 + 'px';
            el.style.height = el.style.width;
            el.style.left = Math.random() * 100 + '%';
            el.style.top = Math.random() * 100 + '%';
            el.style.borderRadius = '50%';
            el.style.background = `radial-gradient(circle at center, ${getRandomColor()} 0%, transparent 70%)`;
            el.style.boxShadow = `0 0 20px ${getRandomColor()}`;
            el.style.animation = `float ${Math.random() * 2 + 1}s ease-in-out infinite`;
            
            celebration.appendChild(el);
            
            // 添加浮动动画
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0%, 100% { transform: translateY(0) rotate(0deg); }
                    50% { transform: translateY(-20px) rotate(180deg); }
                }
            `;
            document.head.appendChild(style);
        }

        // 创建五彩纸屑
        function createConfetti() {
            const colors = ['#00f7ff', '#ff00ff', '#00ff9d', '#ff9d00', '#ff5500'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.opacity = '1';
                
                document.body.appendChild(confetti);
                
                // 动画设置
                const animation = confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    easing: 'cubic-bezier(0.215, 0.610, 0.355, 1)'
                });
                
                // 动画结束后移除元素
                animation.onfinish = () => {
                    confetti.remove();
                };
            }
        }

        // 获取随机颜色
        function getRandomColor() {
            const colors = ['#00f7ff', '#ff00ff', '#00ff9d', '#ff9d00', '#ff5500', '#a855f7'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // 保存高分记录
        function saveHighScore() {
            const time = document.getElementById('timer').textContent;
            const score = attempts;
            
            // 在实际应用中，这里可以保存到localStorage或服务器
            console.log(`🎯 新记录！用时: ${time}, 尝试次数: ${score}`);
            
            // 显示祝贺消息
            setTimeout(() => {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML += `<br><br><i class="fas fa-trophy"></i> 新记录：${score}次尝试，用时${time}`;
                resultDiv.style.fontSize = '1.8rem';
            }, 1000);
        }

        // 键盘支持
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkGuess();
            }
        }

        // 页面加载时初始化游戏
        window.onload = function() {
            initGame();
            
            // 添加CSS动画
            const style = document.createElement('style');
            style.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                    20%, 40%, 60%, 80% { transform: translateX(5px); }
                }
            `;
            document.head.appendChild(style);
        };
    </script>
</body>
</html>
